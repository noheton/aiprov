[project]
name = "aiprov"
version = "0.2.0rc1"
description = "Domain-agnostic AI provenance over W3C PROV-O: agents, activities, telemetry, claims, and a verification ladder with human-only rungs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Florian Krebs" }]
dependencies = ["rdflib>=7.0"]
keywords = ["provenance", "PROV-O", "AI", "RDF", "FAIR"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://w3id.org/aiprov"
Repository = "https://github.com/noheton/aiprov"
Namespace = "https://w3id.org/aiprov/ns"

[project.scripts]
provlog = "aiprov.provlog:main"
aiprov-dashboard = "aiprov.build_dashboard:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiprov"]

[tool.hatch.build]
include = ["src/aiprov/**", "schema/**"]

[tool.ruff]
line-length = 100
