name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.10", "3.12"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check src tests --exit-zero   # advisory until 0.2 (0.1.0 ships the bundle unchanged)
  provenance:
    # the repository follows its own method: its graph must validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run provlog --base https://w3id.org/aiprov/prov/ validate
